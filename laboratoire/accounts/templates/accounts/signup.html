{% extends 'base_layout.html' %}

{% block title %} Signup {% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm mt-5">
      <div class="card-header bg-dark text-white">
        <h4 class="mb-0 text-center">Create Account</h4>
      </div>
      <div class="card-body p-4">
        <form class="form-container" action="{% url 'accounts:signup' %}" method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Signup</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center text-muted small">
        Already have an account? <a href="{% url 'accounts:login' %}" class="text-decoration-none">Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
