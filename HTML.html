











<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="{% url 'homepage' %}">LOGO</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'homepage' %}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'homepage' %}">Articles</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                    </ul>
                    
                    <div class="navbar-nav">
                        {% if user.is_authenticated %}
                            <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                            </form>
                        {% else %}
                            <a class="btn btn-outline-primary btn-sm me-2" href="{% url 'accounts:login' %}">Login</a>
                            <a class="btn btn-primary btn-sm" href="{% url 'accounts:signup' %}">Signup</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- 3. Весь контент теперь будет в центре с отступами -->
        {% block content %}{% endblock %}
    </main>

    <!-- 4. Исправленный Bootstrap JS (обязательно перед закрывающим body) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
